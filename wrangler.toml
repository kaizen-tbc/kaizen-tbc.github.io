# Deploy config for the KRM pilot Worker (kaizen-worker.js) - a SEPARATE
# Worker from production's "kaizen-bot" (see wrangler.toml on main), so
# building/testing this never touches the live site the guild actually
# depends on. Same file as kaizen-bot's, deployed under a different name -
# `name` below controls which Worker `wrangler deploy` targets/creates.
#
# This Worker has none of kaizen-bot's Discord-bot secrets configured
# (DISCORD_BOT_TOKEN etc.) - every Discord-posting feature in the app
# still points at the real kaizen-bot Worker (see RH_WORKER in
# kaizen_raid_manager.html) since duplicating a whole second Discord bot
# install wasn't in scope for this pilot; only /api/state (this Worker,
# via APP_API_WORKER) moved. Posting to Discord from this pilot posts for
# real, same as it always has - nothing about that changed.
name = "krm-hosted-bot"
main = "kaizen-worker.js"
compatibility_date = "2026-08-22"

# Confirmed via `wrangler whoami` - Dsd030708@gmail.com's Account
account_id = "3b9ca148c94560c58ab6cfcc6984406c"

# WCL report data is immutable once logged (parses are locked) - cached here
# indefinitely (no TTL) so re-viewing/re-posting an already-fetched report,
# or tweaking the fallout-report prompt against the same log, costs zero
# further Warcraft Logs API calls. Also holds the short-lived WCL OAuth
# token so every query doesn't re-authenticate from scratch.
[[kv_namespaces]]
binding = "WCL_CACHE"
id = "d8aaec5fbe0942189426e25cb9ab6a81"

# Real database, replacing the GitHub-JSON-as-datastore hack (kaizen_data.json
# committed via the Contents API from the browser). Schema: schema.sql.
# Created via `wrangler d1 create kaizen-db` - single account, single guild
# for now (see schema.sql's own notes on why app_state is one row, not yet
# split per-guild).
[[d1_databases]]
binding = "kaizen_db"
database_name = "kaizen-db"
database_id = "6c91462e-b412-48f1-9585-7813a85d6926"

# Clerk (real Discord/Google sign-in, replacing the shared-secret stopgap
# from the previous step - see verifyAuth in kaizen-worker.js). Both of
# these are public by design (the JWKS URL's whole point is to be safe to
# expose - it's how anyone can verify a Clerk-signed token without ever
# holding a secret), so plain [vars] rather than `wrangler secret put`.
# This is the Development Clerk instance - swap both when moving to a
# production Clerk instance later.
[vars]
CLERK_JWKS_URL = "https://polished-mule-5604.clerk.accounts.dev/.well-known/jwks.json"
CLERK_ISSUER = "https://polished-mule-5604.clerk.accounts.dev"
